#pc{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(6,10,28,.72),rgba(6,10,28,.45) 70%),linear-gradient(180deg,rgba(6,10,28,.35),rgba(6,10,28,.7))}
.ct{position:relative;padding:20px;color:#fff}
h1.cvs{margin:0;font-size:clamp(5rem,22vw,11rem);font-weight:900;letter-spacing:.04em;line-height:1;background:linear-gradient(90deg,#e58f9a,#f3c3ca,#b8d0ec);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(229,143,154,.55))}
.sub{font-size:clamp(1rem,4vw,1.7rem);font-weight:500;margin:10px 0 38px;letter-spacing:.05em;opacity:.95}
#st{font:inherit;font-size:1.25rem;font-weight:700;color:#fff;padding:18px 64px;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 32px rgba(0,0,0,.3);transition:.3s}
#st:hover{transform:translateY(-4px) scale(1.06);background:rgba(229,143,154,.35);box-shadow:0 0 36px rgba(229,143,154,.6)}
#ecg{position:fixed;inset:0;z-index:60;display:none;align-items:center;pointer-events:none}#ecg.run,#ecg.out{display:flex}
#ecg.run{background:rgba(8,10,25,.88)}#ecg.out{background:rgba(8,10,25,.88);animation:fo .5s forwards}@keyframes fo{to{opacity:0}}
#ecg svg{width:100%;height:240px;animation:sl .5s ease-out}@keyframes sl{from{transform:translateX(-40%)}}
#ecg path{fill:none;stroke:#e07a8a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 8px #e07a8a) drop-shadow(0 0 18px #e07a8a);vector-effect:non-scaling-stroke}
#ecg.run path,#ecg.out path{animation:dr 1.1s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.hd{text-align:center;margin-bottom:10px}.hd h1{margin:0;font-size:3rem;font-weight:900;background:linear-gradient(90deg,var(--red),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}.hd p{margin:4px 0 0;color:var(--mu)}
h3{font-size:1.4rem;margin:28px 0 6px;display:flex;align-items:center;gap:10px}h3:before{content:"";width:6px;height:24px;border-radius:4px;background:var(--red)}
.grid{display:grid;gap:14px;margin:12px 0}#fg{grid-template-columns:repeat(3,1fr)}#rg,#ag{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
button.card{font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;padding:14px;transition:.25s}
button.card:hover{transform:translateY(-6px);box-shadow:0 16px 38px rgba(184,96,108,.2)}#fg .card.wide{grid-column:1/-1;min-height:96px}button.card:disabled{opacity:.55;cursor:default}button.card:disabled:hover{transform:none;box-shadow:var(--sh)}.card i{font-size:1.9rem;font-style:normal}.card b{font-size:1.1rem}.card small{color:var(--mu)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;margin-bottom:14px}h2{margin:0;font-size:1.25rem}
.q{padding:18px;margin-bottom:14px}.qt{font-weight:600;line-height:1.55;margin-bottom:6px}.big .qt{font-size:1.15rem}
.num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-size:.8rem;margin-right:10px}
.bar{height:8px;border-radius:9px;background:var(--bl);margin-bottom:14px;overflow:hidden}.bar u{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--blue));transition:width .4s}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border-radius:16px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;line-height:1.45;transition:.2s}
button.opt{cursor:pointer}button.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--blue)}.opt em{font-style:normal;font-weight:700;min-width:26px;height:26px;border-radius:50%;background:var(--bl);display:grid;place-items:center;font-size:.8rem}
.opt.sel{border-color:var(--tx)}.opt.ok{background:var(--blue);color:#fff;border-color:var(--blue)}.opt.bad{background:var(--red);color:#fff;border-color:var(--red)}.opt.ok em,.opt.bad em{background:rgba(255,255,255,.25)}
.why{font-size:.85rem;color:var(--mu);margin:4px 8px 0}.ok+.why{color:var(--blue)}.bad+.why{color:var(--red)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.b,.g{font:inherit;font-weight:600;border-radius:14px;padding:14px 26px;border:0;cursor:pointer;min-height:48px;transition:.2s;color:var(--tx)}
.b{background:linear-gradient(135deg,#d08a93,#b5616d);color:#fff;box-shadow:0 6px 18px rgba(184,96,108,.28)}.g{background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(10px)}
.b:disabled{opacity:.4;cursor:not-allowed}.b:hover:not(:disabled),.g:hover{transform:translateY(-2px)}.w{width:100%;margin-top:14px}
.ans{margin:10px 0 12px;padding:14px;border-radius:14px;background:var(--bl);white-space:pre-line;line-height:1.6}.ans[hidden]{display:none}
.rs{text-align:center;padding:32px 20px}.sc{font-size:3.6rem;font-weight:800;color:var(--blue)}.msg{font-size:1.2rem;margin:16px 0 24px;line-height:1.8}.rs .nav{justify-content:center}
@media(max-width:560px){#fg{grid-template-columns:1fr 1fr 1fr;gap:10px}#fg .card small{display:none}.top{flex-wrap:wrap}}

h1.cvs{font-family:Montserrat,Poppins,system-ui,sans-serif;font-weight:900;letter-spacing:.12em;padding-left:.12em;background:linear-gradient(100deg,#e58f9a 0%,#f3c3ca 45%,#b8d0ec 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 28px rgba(229,143,154,.6))}
.sub{font-weight:300;text-transform:uppercase;letter-spacing:.38em;font-size:clamp(.8rem,3.2vw,1.25rem);margin:14px 0 46px;padding-left:.38em}
.sub:after{content:"";display:block;width:90px;height:2px;margin:18px auto 0;background:linear-gradient(90deg,transparent,#e58f9a,transparent)}
#st{position:relative;overflow:hidden;font-family:Poppins,sans-serif;font-weight:600;font-size:1.05rem;letter-spacing:.35em;text-transform:uppercase;padding:18px 58px 18px calc(58px + .35em);background:linear-gradient(135deg,rgba(229,143,154,.38),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 40px rgba(229,143,154,.35),inset 0 1px 0 rgba(255,255,255,.5)}
#st:before{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shn 3s infinite}
@keyframes shn{60%,100%{left:140%}}
.b,.g,.opt,.card b{font-family:Poppins,sans-serif;letter-spacing:.02em}
.b{border-radius:999px;padding:14px 30px}.g{border-radius:999px;padding:14px 28px}
.hd h1{font-family:Montserrat,Poppins,sans-serif;letter-spacing:.1em}

body,button,.b,.g,.opt,.card b,#st,.hd p,.top h2{font-family:David,"David Libre",serif!important}
body{font-size:1.12rem}.opt,.qt,.ans{font-size:1.08rem}
h1.cvs,.hd h1{font-family:"Baguet Script",cursive!important;font-weight:400!important;letter-spacing:.02em!important;padding-left:0!important}
h1.cvs{font-size:clamp(6rem,26vw,13rem)}.hd h1{font-size:3.6rem}

ference between a medium-sized artery and a medium-sized vein?", "o": ["The artery has a well-developed internal elastic lamina.", "The vein has more elastic fibers in its tunica media.", "The artery has a wider lumen.", "The vein has a thicker tunica media."], "a": 0, "s": "histo"}, {"q": "Which finding belongs to the major manifestations of rheumatic fever?", "o": ["Arthralgia", "Fever", "Migratory arthritis of large joints", "Elevated acute-phase reactants"], "a": 2, "s": "micro"}, {"q": "During phase 3 of the cardiac action potential, repolarization is mainly due to which of the following?", "o": ["Cl⁻ influx", "Na⁺ influx", "K⁺ efflux", "Ca²⁺ influx"], "a": 2, "s": "physio"}, {"q": "Which combination should be avoided due to risk of severe bradycardia/heart block?", "o": ["DHP CCB + ARB", "Thiazide + ACEI", "Non-dihydropyridine CCB + beta-blocker", "Loop diuretic + spironolactone"], "a": 2, "s": "pharma"}, {"q": "Dihydropyridine calcium channel blockers (e.g., amlodipine, nifedipine) lower blood pressure primarily through which of the following mechanisms?", "o": ["Inhibition of renin release from the juxtaglomerular apparatus", "Direct negative inotropic effect on ventricular myocytes", "Stimulation of central alpha₂ receptors", "Blockade of L-type calcium channels in arterial smooth muscle leading to decreased peripheral vascular resistance (PVR)"], "a": 3, "s": "pharma"}, {"q": "Which of the following is among the most common causes of viral myocarditis?", "o": ["Hepatitis C virus", "Rabies virus", "Paramyxovirus", "Adenovirus"], "a": 3, "s": "micro"}, {"q": "A patient with excessive tachycardia has a heart rate above 200 beats/min. Which mechanism can reduce cardiac output?", "o": ["Prolonged diastole", "Increased ventricular filling", "Shortened diastole and reduced ventricular filling", "Increased preload"], "a": 2, "s": "physio"}, {"q": "Why is tetanus not possible in a normal cardiac muscle cell?", "o": ["Because of the long absolute refractory period which coincides with systole.", "Because the sarcoplasmic reticulum is underdeveloped.", "Because cardiac muscle does not follow the all-or-none rule.", "Because the refractory period is too short."], "a": 0, "s": "physio"}, {"q": "Which of the following structures is a content of the superior mediastinum?", "o": ["Descending thoracic aorta", "Lungs", "Trachea", "Pericardium with heart"], "a": 2, "s": "anat"}, {"q": "Which of the following laboratory tests can be used for diagnosis of viral myocarditis?", "o": ["Blood culture", "In vitro sensitivity test to select suitable antibiotic treatment", "Culture on nutrient agar plate", "Serology for antibody detection"], "a": 3, "s": "micro"}, {"q": "Which of the following specimens can be used for laboratory diagnosis of Streptococcus pyogenes infection?", "o": ["Urine sample", "Stool sample", "Throat swab", "Hair sample"], "a": 2, "s": "micro"}, {"q": "The pulmonary veins open into which of the following?", "o": ["Right ventricle", "Left ventricle", "Left atrium", "Right atrium"], "a": 2, "s": "anat"}, {"q": "According to Starling's law, an increase in end-diastolic volume within physiological limits causes?", "o": ["Decreased force of contraction", "Increased force of contraction", "Decreased venous return", "Decreased stroke volume"], "a": 1, "s": "physio"}, {"q": "Fibrous pericardium is not supplied by which of the following arteries?", "o": ["Musculophrenic arteries", "Pericardiacophrenic arteries", "Coronary arteries", "Descending aorta"], "a": 2, "s": "anat"}, {"q": "Blood vessels are generally composed of three layers called tunica which differ from each other by their components. Tunica media is formed of which of the following?", "o": ["Collagen type I and vasa vasorum", "Endothelium and subendothelium", "Internal elastic lamina and lymphatics", "Smooth muscle fiber and external elastic lamina"], "a": 3, "s": "histo"}, {"q": "During a histology lab, a student observes a slide of the heart wall. They identify a layer that is continuous with the tunica intima of the great vessels. This layer is which of the following?", "o": ["The fibrous pericardium", "The endocardium", "The epicardium", "The myocardium"], "a": 1, "s": "histo"}, {"q": "A 62-year-old male with hypertension and benign prostatic hyperplasia (BPH) would derive dual clinical benefit from the addition of which of the following antihypertensive agents?", "o": ["Aliskiren", "Hydrochlorothiazide", "Metoprolol", "Prazosin"], "a": 3, "s": "pharma"}, {"q": "In the immune-complex theory of rheumatic fever, what directly contributes to tissue inflammation?", "o": ["Mechanical injury from circulating platelets", "Antibody destruction of erythrocytes", "Direct bacterial multiplication inside collagen", "Deposition of antigen-antibody complexes"], "a": 3, "s": "patho"}, {"q": "Aschoff's nodules are characteristically located within which of the following?", "o": ["Myocardial interstitium", "Pericardial cavity", "Valve lumen", "Endocardial blood vessels only"], "a": 0, "s": "patho"}, {"q": "Circumflex artery arises from which of the following?", "o": ["Right coronary artery", "Ascending aorta", "Aortic arch", "Left coronary artery"], "a": 3, "s": "anat"}, {"q": "Which of the following waves of the ECG represents repolarization of the ventricle?", "o": ["PR interval", "T wave", "QRS complex", "P wave"], "a": 1, "s": "physio"}, {"q": "Infective endocarditis vegetation consists of which of the following?", "o": ["Only inflammatory cells", "Platelets, fibrin & bacterial colonies", "Only platelets", "Only RBCs"], "a": 1, "s": "patho"}, {"q": "The \"vasa vasorum\" are small blood vessels that supply the walls of large blood vessels. Where are they more commonly found?", "o": ["In the walls of capillaries", "In the endocardium", "In the walls of veins", "In the walls of arteries"], "a": 2, "s": "histo"}, {"q": "Which phase of the fast-response cardiac action potential is characterized by a rapid influx of sodium ions?", "o": ["Phase 2", "Phase 1", "Phase 4", "Phase 0"], "a": 3, "s": "physio"}, {"q": "What is a distinguishing histological feature of the tunica intima in coronary arteries?", "o": ["It lacks an endothelium", "The subendothelial layer contains longitudinal smooth muscle fibers", "It is very thin", "It has a poorly developed internal elastic lamina"], "a": 1, "s": "histo"}, {"q": "A 55-year-old male presents to the emergency department with severe crushing chest pain radiating to his left arm. An ECG confirms a myocardial infarction. A histological sample of his heart is taken. Which of the following structures is primarily responsible for the wringing action of the heart during contraction?", "o": ["The endocardium", "The spiral arrangement of cardiac muscle fibers", "The Purkinje fibers", "The epicardium"], "a": 1, "s": "histo"}, {"q": "Which of the following is a complication of infective endocarditis?", "o": ["Portal hypertension", "Pulmonary fibrosis", "Osler’s nodes", "Atelectasis"], "a": 2, "s": "patho"}, {"q": "Rheumatic heart disease is characterized by involvement of which of the following?", "o": ["Only the endocardium", "All three layers of the heart", "Only the myocardium", "Only the pericardium"], "a": 1, "s": "patho"}, {"q": "Contraction of skeletal muscles can increase heart rate through which of the following?", "o": ["Carotid sinus reflex", "Oculo-cardiac reflex", "Bainbridge reflex", "Alam-Smirk reflex"], "a": 3, "s": "physio"}, {"q": "Base of the heart is mainly formed by which of the following?", "o": ["Right atrium", "Left ventricle", "Right ventricle", "Left atrium"], "a": 3, "s": "anat"}, {"q": "Which of the following structures is found in the intercalated disc and is responsible for anchoring actin filaments?", "o": ["Tight junctions", "Gap junctions", "Fascia adherens", "Desmosomes"], "a": 2, "s": "histo"}, {"q": "What is the approximate resting cardiac output in a healthy adult?", "o": ["2 L/min", "7.5 L/min", "5 L/min", "3.2 L/min"], "a": 2, "s": "physio"}, {"q": "Which of the following are sinuses of the pericardium?", "o": ["Transverse and vertical", "Transverse and oblique", "Superior and inferior", "Anterior and posterior"], "a": 1, "s": "anat"}, {"q": "Which of the following mechanisms adds further damage to myocardial cells in case of viral myocarditis?", "o": ["Interruption of blood supply", "Venous thrombosis", "Inflammatory and immune mediated damage", "Drug induced damage"], "a": 2, "s": "patho"}, {"q": "Which of the following laboratory tests can be used for diagnosis of viral myocarditis?", "o": ["In vitro sensitivity test to select suitable antibiotic treatment", "Serology for antibody detection", "Blood culture", "Culture on nutrient agar plate"], "a": 1, "s": "micro"}, {"q": "The coronary arteries arise from which of the following?", "o": ["Arch of aorta", "Ascending aorta", "Abdominal aorta", "Descending aorta"], "a": 1, "s": "anat"}, {"q": "Which vessel type is characterized by a thin wall, a thin tunica media devoid of elastic fibers, and a well-developed internal elastic lamina?", "o": ["Pulmonary artery", "Aorta", "Coronary artery", "Cerebral (basilar) artery"], "a": 3, "s": "histo"}, {"q": "A 58-year-old male with essential hypertension and type 2 diabetes mellitus is started on enalapril. Two weeks later, he returns complaining of a persistent, annoying dry cough. Which of the following is the primary biochemical mediator responsible for this adverse effect?", "o": ["Prostaglandin depletion", "Bradykinin accumulation", "Serotonin release", "Histamine accumulation"], "a": 1, "s": "pharma"}, {"q": "A patient receives strong vagal stimulation. Which change would be expected in the SA node?", "o": ["Increased sympathetic activity", "Increased excitability", "Decreased rate of rhythm", "Increased rhythmicity"], "a": 2, "s": "physio"}, {"q": "In acute rheumatic myocarditis, the heart muscle is most likely to be which of the following?", "o": ["Calcified and rigid", "Swollen and flabby with dilated chambers", "Atrophic with collapsed chambers", "Firm, contracted, and small"], "a": 1, "s": "patho"}, {"q": "A researcher is studying the electrical conduction system of the heart. They isolate a specific type of cell that is larger than typical cardiac muscle fibers, has a clear appearance due to glycogen, and has one or two peripheral nuclei. These cells are most likely?", "o": ["Endothelial cells", "Cardiac myocytes", "Purkinje fibers", "Fibroblasts"], "a": 2, "s": "histo"}, {"q": "Acute bacterial endocarditis (ABE) is characterized by which of the following?", "o": ["Slowly progressive infection", "Occurs in mainly diseased valves", "Mild valvular destruction", "Highly virulent organisms"], "a": 3, "s": "patho"}, {"q": "Mitral valve separates between which of the following?", "o": ["Right ventricle and left ventricle", "Left atrium and right atrium", "Left atrium and left ventricle", "Right atrium and right ventricle"], "a": 2, "s": "anat"}, {"q": "Which diuretic is preferred for managing volume overload in a hypertensive patient with significant renal impairment?", "o": ["Thiazide", "Loop diuretic", "Acetazolamide", "K⁺-sparing diuretic"], "a": 1, "s": "pharma"}, {"q": "How is echovirus primarily transmitted?", "o": ["Direct contact with infected individuals", "Ingestion of contaminated food", "Respiratory droplets", "Fecal-oral route"], "a": 3, "s": "micro"}, {"q": "Descending thoracic aorta is the continuation of which of the following?", "o": ["Arch of aorta", "Ascending aorta", "Brachiocephalic artery", "Left subclavian artery"], "a": 0, "s": "anat"}, {"q": "Anterior interventricular artery arises from which of the following?", "o": ["Ascending aorta", "Aortic arch", "Right coronary artery", "Left coronary artery"], "a": 3, "s": "anat"}, {"q": "Medium sized arteries are classified as?", "o": ["Intermediate arteries", "Elastic arteries", "Conducting arteries", "Distributing arteries"], "a": 3, "s": "histo"}, {"q": "Apex of the heart is mainly formed by which of the following?", "o": ["Right atrium", "Left atrium", "Left ventricle", "Right ventricle"], "a": 2, "s": "anat"}]}], "w": [{"n": "1st Week", "q": [["Enumerate the phases of the fast cardiac action potential in ordinary cardiac muscle.", "1. Phase 0: Depolarization.\n2. Phase 1: Initial repolarization.\n3. Phase 2: Plateau.\n4. Phase 3: Final repolarization.\n5. Phase 4: Resting membrane potential.", "physio"], ["What causes phase 0 of the myocardial action potential?", "Rapid opening of fast voltage-gated Na⁺ channels.", "physio"], ["What is the role of gap junctions in cardiac muscle?", "They allow rapid spread of ions and action potentials between cardiac cells.", "physio"], ["An electrophysiology study measures impulse propagation... delay of 0.16 sec... Identify the anatomical structure responsible for this delay and state its functional significance.", "The AV node; its delay allows atrial emptying before ventricular contraction and protects the ventricles from\nrapid atrial rhythms.", "physio"], ["Summarize the steps of excitation–contraction coupling in cardiac muscle from action potential to cross-bridge formation.", "Ca²⁺ entry → Ca²⁺ release from the sarcoplasmic reticulum → binding to troponin C → exposure of actin sites\n→ actin–myosin cross-bridge formation.", "physio"], ["Describe the mechanism of the Staircase Phenomenon.", "Repeated stimulation progressively increases contraction strength because of intracellular Ca²⁺ accumulation\nand incomplete Ca²⁺ reuptake.", "physio"], ["Enumerate FOUR contents of the posterior mediastinum.", "a. Descending thoracic aorta.\nb. Azygos vein.\nc. Oesophagus.\nd. Thoracic duct.", "anat"], ["Enumerate FOUR contents of the superior mediastinum.", "a. Arch of the aorta.\nb. Brachiocephalic veins.\nc. Trachea.\nd. Oesophagus.", "anat"], ["Mention the pericardial sinuses of the heart.", "a. Oblique pericardial sinus.\nb. Transverse pericardial sinus.", "anat"], ["What is the part forming apex of the heart and mention its surface anatomy?", "The apex is formed by the left ventricle and lies in the left fifth intercostal space, 9 cm from the midline.", "anat"], ["List openings into the right atrium of the heart.", "a. Superior vena cava.\nb. Inferior vena cava.\nc. Coronary sinus.\nd. Right atrioventricular orifice.\ne. Anterior cardiac veins.\nf. Venae cordis minimae.", "anat"], ["Complete: Coronary sinus is the continuation of ______ and ends in ______.", "Great cardiac vein; right atrium.", "anat"], ["Complete: Coronary arteries are branches of ______.", "Ascending aorta.", "anat"], ["Complete: Right subclavian artery is a branch of ______.", "Brachiocephalic artery.", "anat"], ["Complete: Arch of aorta is the continuation of ______.", "Ascending aorta.", "anat"], ["Complete: Azygos vein opens into ______.", "Superior vena cava.", "anat"], ["Enumerate THREE branches of the arch of aorta.", "a. Brachiocephalic artery.\nb. Left common carotid artery.\nc. Left subclavian artery.", "anat"], ["Mention TWO branches of left coronary artery.", "a. Anterior interventricular artery.\nb. Circumflex artery.", "anat"], ["Mention TWO branches of right coronary artery.", "a. Marginal artery.\nb. Posterior interventricular artery.", "anat"], ["What are the tributaries of the coronary sinus?", "a. Great cardiac vein.\nb. Middle cardiac vein.\nc. Small cardiac vein.\nd. Oblique vein of the left atrium.\ne. Posterior vein of the left ventricle.", "anat"], ["List layers of the heart.", "1. Epicardium.\n2. Myocardium.\n3. Endocardium.", "anat"], ["Describe LM of cardiac muscles.", "Short, branched, striated cells with one or two central nuclei and intercalated discs.", "histo"], ["Define cardiac diads.", "One T-tubule associated with one sarcoplasmic reticulum cisterna at the Z-line.", "histo"], ["Enumerate parts of intercalated disc.", "1. Fascia adherens.\n2. Desmosomes.\n3. Gap junctions.", "histo"], ["Describe pericardium.", "A fibroserous sac surrounding the heart. It consists of an outer fibrous pericardium and an inner serous\npericardium with parietal and visceral layers.", "anat"], ["Compare between cardiac muscles and conducting fibers.", "Cardiac muscles: Smaller and contractile; One or two central nuclei; Numerous myofilaments; More deeply\nstained.\nConducting fibers: Larger and conduct impulses; One or two peripheral nuclei; Fewer myofilaments; Pale,\nglycogen-rich cytoplasm.", "histo"]]}, {"n": "2nd Week", "q": [["Complete: Coronary sinus is the continuation of ______ and ends in ______.", "Great cardiac vein; right atrium.", "anat"], ["Complete: Coronary arteries are branches of ______.", "Ascending aorta.", "anat"], ["Complete: Right subclavian artery is a branch of ______.", "Brachiocephalic artery.", "anat"], ["Complete: Arch of aorta is the continuation of ______.", "Ascending aorta.", "anat"], ["Complete: Azygos vein opens into ______.", "Superior vena cava.", "anat"], ["Enumerate THREE branches of the arch of aorta.", "1. Brachiocephalic artery\n2. Left common carotid artery\n3. Left subclavian artery", "anat"], ["Mention TWO branches of the left coronary artery.", "1. Anterior interventricular (descending) artery\n2. Circumflex artery", "anat"], ["Mention TWO branches of the right coronary artery.", "1. Marginal branch\n2. Posterior interventricular branch", "anat"], ["What are the tributaries of the coronary sinus?", "1. Great cardiac vein\n2. Middle cardiac vein\n3. Small cardiac vein\n4. Oblique vein of left atrium\n5. Posterior vein of left ventricle", "anat"], ["What are the three standard bipolar limb leads of ECG?", "• Lead I: Right arm (−) → Left arm (+)\n• Lead II: Right arm (−) → Left leg (+)\n• Lead III: Left arm (−) → Left leg (+)", "physio"], ["Describe the normal ECG waves.", "• P wave: atrial depolarization.\n• QRS complex: ventricular depolarization.\n• T wave: ventricular repolarization.", "physio"], ["Why is the atrial repolarization wave not normally seen?", "Because it is masked by the QRS complex and has a low voltage.", "physio"], ["What is the PR interval and what is its normal duration?", "Measured from the beginning of the P wave to the beginning of the QRS complex. It represents conduction of impulses from the atria to the ventricles.\nNormal duration: 0.12–0.20 second.", "physio"], ["List types of blood vessels.", "1. Large elastic arteries\n2. Medium muscular arteries\n3. Small arteries (arterioles)\n4. Veins\n5. Capillaries", "histo"], ["Describe the structure of the aorta.", "Tunica intima: endothelium, narrow subendothelial connective tissue, internal elastic lamina present but indistinct.\nTunica media: thickest layer; fenestrated elastic lamellae alternating with smooth muscle cells.\nTunica adventitia: thin fibroelastic connective tissue containing vasa vasorum.", "histo"], ["Describe the wall of arterioles.", "• Narrow lumen, relatively thick wall\n• Thin tunica intima lined by endothelium\n• Tunica media of a few layers of smooth muscle fibers\n• Very thin tunica adventitia", "histo"], ["Compare between medium-sized artery and medium-sized vein.", "Artery: thick wall, narrow circular lumen, no valves, thick tunica media.\nVein: thin wall, usually collapsed lumen, valves may be present, thin tunica media.", "histo"], ["Describe the histology of the basilar artery.", "• Specialized medium-sized artery\n• Thin wall, thin tunica media devoid of elastic fibers\n• Well-developed internal elastic lamina", "histo"]]}, {"n": "3rd Week", "q": [["Pathologic lesion of rheumatic carditis", "Aschoff body (Aschoff nodule).", "patho"], ["Gross and microscopic picture of rheumatic carditis", "Gross: tiny gray-white Aschoff nodules (1–2 mm); heart muscle swollen and flabby.\nMicroscopic: fibrinoid degeneration of collagen; macrophages, lymphocytes, plasma cells; Anitschkow cells and Aschoff giant cells.", "patho"], ["Four complications of rheumatic heart disease", "A. Subacute bacterial endocarditis\nB. Heart failure\nC. Embolic manifestations (multiple infarctions)\nD. Cardiac arrhythmias", "patho"], ["Morphology of chronic rheumatic pericarditis", "• Milk patches of fibrosis\n• Adhesive pericarditis\n• Mediastino-pericarditis", "patho"], ["Gross and microscopic picture of rheumatic vegetations", "Gross: multiple small gray firm sterile vegetations along the line of valve closure.\nMicroscopic: edematous vascular cusps; mononuclear inflammatory infiltrate; platelet and fibrin vegetations.", "patho"], ["Pathogenesis of rheumatic fever", "Following Group A streptococcal pharyngitis, antibodies formed against M protein cross-react with cardiac tissues, causing autoimmune inflammation and tissue damage.", "patho"], ["Indications and contraindications of ACEIs & ARBs", "Preferred indications: diabetic/proteinuric CKD; post-myocardial infarction.\nAbsolute contraindications: pregnancy; bilateral renal artery stenosis.", "pharma"], ["Hypertensive emergency vs hypertensive urgency", "Emergency: severe hypertension with acute target-organ damage; IV medications; gradual BP reduction (DBP about 100–110 mmHg initially).\nUrgency: severe hypertension without target-organ damage; oral medications.", "pharma"], ["Mechanism of action of dihydropyridine CCBs", "They block L-type calcium channels in vascular smooth muscle, causing vasodilation, decreased peripheral vascular resistance, and decreased blood pressure.", "pharma"], ["Clinical use and adverse effect of diuretics", "Thiazides: mild to moderate hypertension; hypokalemia.\nLoop diuretics: hypertensive emergency / pulmonary edema; hypokalemia.", "pharma"], ["Preferred antihypertensive drugs", "A. Post-MI: beta-blockers, ACE inhibitors, ARBs\nB. Pregnancy: methyldopa, labetalol, nifedipine\nC. Diabetes with CKD: ACE inhibitors, ARBs, RAAS inhibitors", "pharma"], ["Function of the vasoconstrictor center", "It increases sympathetic outflow to blood vessels causing vasoconstriction, increased peripheral resistance, and increased arterial blood pressure.", "physio"], ["Vagal tone of the heart", "Continuous parasympathetic (vagal) activity that decreases heart rate and cardiac output.", "physio"], ["Mary's law of baroreceptors", "An increase in arterial blood pressure increases baroreceptor firing, producing reflex reduction of heart rate and blood pressure.", "physio"], ["Effect of pain and oculo-cardiac reflex on heart rate", "• Pain usually causes tachycardia.\n• Oculo-cardiac reflex causes bradycardia.", "physio"], ["Cardiac output and normal resting value", "Cardiac output is the volume of blood pumped by the heart per minute.\nCO = Stroke Volume × Heart Rate\nNormal resting value ≈ 5 L/min.", "physio"], ["Main factors controlling cardiac output", "• Heart rate\n• Stroke volume", "physio"], ["Afterload and its effect on cardiac output", "Afterload is the resistance against which the ventricle pumps blood. Increased afterload decreases stroke volume and cardiac output.", "physio"], ["Role of heart rate in increasing cardiac reserve during exercise", "During exercise, heart rate increases, leading to increased cardiac output and increased cardiac reserve to meet the body's metabolic demands.", "physio"]]}, {"n": "4th Week", "q": [["Enumerate types of endocarditis.", "Non-infective endocarditis:\n• Rheumatic endocarditis\n• Atypical verrucous (Libman-Sacks) endocarditis in SLE\n• Non-bacterial thrombotic (terminal) endocarditis\n• Carcinoid endocarditis\nInfective endocarditis:\n• Acute bacterial endocarditis\n• Subacute bacterial endocarditis (SABE)\n• Fungal and viral endocarditis\n• Chronic endocarditis (e.g. tuberculosis, syphilis)", "patho"], ["Enumerate complications of acute bacterial endocarditis.", "• Severe myocardial degenerative changes\n• Embolic lesions due to detachment of septic vegetations leading to systemic pyemia and pyaemic abscesses\n• Severe toxemia, septicemia and pyaemia\n• Cusp perforation\n• Heart failure", "patho"], ["Enumerate complications of subacute bacterial endocarditis.", "• Infarction of kidney, brain and spleen\n• Retinal necrosis and blindness\n• Coronary artery embolism (rare)\n• Mycotic aneurysms in cerebral and mesenteric arteries\n• Osler nodules\n• Focal glomerulonephritis\n• Moderate toxemia causing fever, anemia, clubbing of fingers, splenomegaly and petechial hemorrhage\n• Valve stenosis or incompetence leading to heart failure\n• Renal failure", "patho"], ["Enumerate types of acute pericarditis.", "• Serous pericarditis\n• Fibrinous (serofibrinous) pericarditis\n• Suppurative pericarditis\n• Hemorrhagic pericarditis\n4th Week Assignment", "patho"], ["Enumerate types of chronic pericarditis.", "• Adherent mediastino-pericarditis\n• Constrictive pericarditis\n• Tuberculous pericarditis", "patho"], ["Compare between acute and subacute bacterial endocarditis.", "TABLE\nFeature~Acute (ABE)~Subacute (SABE)\nOrganisms~highly virulent pyogenic (e.g. Staphylococcus)~low virulent non-pyogenic (e.g. Streptococcus viridans)\nOccurrence~during septicemia~during bacteremia\nValves affected~healthy valves~diseased / predisposed valves\nValvular damage~more~less\nInflammation~severe~mild\nAge~usually older (50–60 years)~young age and children\nValve destruction~ulceration, perforation or rupture~slow and mild damage\nVegetations~large, globular, soft, friable, easily detached~large, polypoid, friable, easily detached\nEmboli~septic emboli causing pyemia and pyaemic abscesses~aseptic emboli causing infarction\nCourse~rapid, fatal~slow\nCauses of death~septicemia, valve perforation, heart failure~heart failure, embolic complications, renal failure, cerebral hemorrhage\nMortality~high~low", "patho"], ["Compare between rheumatic vegetation and infective endocarditis vegetation.", "TABLE\nFeature~Rheumatic Vegetation~Infective Endocarditis Vegetation\nSize~small~large\nConsistency~firm~friable / soft\nAppearance~warty~soft, bulky\nArrangement~along line of closure~anywhere on valve cusps\nAttachment~difficult to detach~easily detached\nContent~sterile (non-infective)~bacteria with fibrin and plate function fList(rev){md='l';$('#qz').innerHTML=`<div class="wrap"><div class="top card"><div><h2>${S.t}</h2><small>${S.q.length} questions${rev?' · Review':''}</small></div><button class="b" onclick="fExam()" ${S.q.length?'':'disabled'}>Exam now</button></div>${PH&&!rev?sw(0):''}${rev||S0.nc?'':chips(S0.q,'setF')}`+(S.q.length?'':'<div class="q card">No questions in this section yet.</div>')+S.q.map((q,n)=>`<div class="q card"><div class="qt"><span class="num">${n+1}</span>${esc(q.q)}</div>`+q.o.map((o,j)=>`<div class="opt ${j==q.a?'ok':rev&&ans[n]==j?'bad':''}"><em>${L[j]}</em>${esc(o)}</div>`).join('')+`</div>`).join('')+`<div class="nav"><button class="g" onclick="go('home')">Back</button></div></div>`;scrollTo(0,0)}

function fQ(){md='e';const q=S.q[i],n=S.q.length,c=cf[i],s=ans[i];$('#qz').innerHTML=`<div class="wrap"><div class="top card"><div><h2>${S.t}</h2><small>Question ${i+1} / ${n}</small></div></div>${S0.nc?'':chips(S0.q,'setE')}<div class="bar"><u style="width:${(i+(c?1:0))/n*100}%"></u></div><div class="q card"><div class="qt">${esc(q.q)}</div>`+q.o.map((o,j)=>{let k='';if(c)k=j==q.a?'ok':j==s?'bad':'';else if(j==s)k='sel';return `<button class="opt ${k}" ${c?'disabled':''} onclick="ans[i]=${j};fQ()"><em>${L[j]}</em>${esc(o)}</button>`+(c?`<div class="why">${j==q.a?'✔ Correct answer.':j==s?'✘ Incorrect – your choice. Correct answer: '+L[q.a]+'.':'✘ Incorrect option.'}</div>`:'')}).join('')+(s!=null&&!c?`<button class="b w" onclick="cf[i]=1;fQ()">Confirm</button>`:'')+`</div><div class="nav"><button class="g" onclick="${i?'i--;fQ()':'fList(0)'}">Back</button><button class="b" ${c?'':'disabled'} onclick="${i==n-1?'res()':'i++;fQ()'}">${i==n-1?'Finish':'Next'}</button></div></div>`;scrollTo(0,0)}
function res(){md='r';const n=S.q.length,s=S.q.filter((q,k)=>ans[k]==q.a).length,p=s/n*100;const m=p==100?'يا سلام عليك! ١٠٠٪ – إنت وحش في الـCVS بجد 🔥🫀':p>=80?'تحفة! شغل عالي جداً، كمّل كده يا بطل 💪':p>=60?'حلو أوي! شوية مراجعة كمان وتبقى زي الفل 👌':p>=40?'مش وحش، بس محتاج تذاكر أكتر شوية.. إنت قدها 💙':'ولا يهمك، راجع كويس وجرّب تاني، والجاي أحسن إن شاء الله 🌟';$('#qz').innerHTML=`<div class="wrap"><div class="rs card"><h2>${S.t}</h2><div class="sc">${s} / ${n}</div><small>${Math.round(p)}% correct</small><div class="msg" dir="rtl">${m}</div><div class="nav"><button class="g" onclick="fList(1)">Review</button><button class="b" onclick="go('home')">Home</button></div></div></div>`;scrollTo(0,0)}
function A(a){if(!a.startsWith('TABLE\n'))return esc(a);const R=a.slice(6).split('\n').map(l=>l.split('~'));return '<div class="tw"><table class="tb">'+R.map((c,k)=>'<tr>'+c.map(x=>k?'<td>'+esc(x)+'</td>':'<th>'+esc(x)+'</th>').join('')+'</tr>').join('')+'</table></div>'}
let W;function openW(k){PH=0;W0=W=D.w[k];fl='all';wList();go('as')}let PH=0;function sw(c){return '<div class="seg"><button class="'+(c?'':'on')+'" onclick="phSw(0)">MCQs<b>'+D.ph.m.length+'</b></button><button class="'+(c?'on':'')+'" onclick="phSw(1)">SAQs<b>'+D.ph.s.length+'</b></button></div>'}function openP(){phSw(0)}function phSw(k){PH=1;fl='all';if(k==0){S0=S={t:'Physiology – MCQs',q:D.ph.m,nc:1};ans=[];cf=[];fList(0);go('qz')}else{W0=W={n:'Physiology – SAQs',q:D.ph.s,nc:1};wList();go('as')}}
function wList(){md='wl';$('#as').innerHTML=`<div class="wrap"><div class="top card"><div><h2>${W.n}</h2><small>${W.q.length} questions</small></div><button class="b" onclick="wCards(0)" ${W.q.length?'':'disabled'}>Exam now</button></div>${PH?sw(1):''}${W0.nc?'':chips(W0.q,'setW',1)}`+(W.q.length?'':'<div class="q card">No questions in this section yet.</div>')+W.q.map((x,n)=>`<div class="q card"><div class="qt"><span class="num">${n+1}</span>${esc(x[0])}</div><div class="ans" id="a${n}">${A(x[1])}</div></div>`).join('')+`<div class="nav"><button class="g" onclick="go('home')">Back</button></div></div>`;scrollTo(0,0)}
function tg(n){const a=$('#a'+n),b=$('#t'+n);a.hidden=!a.hidden;b.textContent=a.hidden?'Show Answer':'Hide Answer'}
function wCards(n){md='wc';cn=n;const x=W.q[n],T=W.q.length;$('#as').innerHTML=`<div class="wrap"><div class="top card"><div><h2>${W.n}</h2><small>Question ${n+1} / ${T}</small></div><button class="g" onclick="wList()">List</button></div>${W0.nc?'':chips(W0.q,'setC',1)}<div class="bar"><u style="width:${(n+1)/T*100}%"></u></div><div class="q card big"><div class="qt">${esc(x[0])}</div><div class="ans" id="a" hidden>${A(x[1])}</div></div><button class="g w" id="t" onclick="tg('')">Show Answer</button><div class="nav"><button class="g" onclick="${n?`wCards(${n-1})`:'wList()'}">Back</button><button class="b" ${n==T-1?'disabled':''} onclick="wCards(${n+1})">Next</button></div></div>`;scrollTo(0,0)}
const cv=$('#pc'),cx=cv.getContext('2d');let cw,ch,ox,oy,iw,ih;
function rs(){cw=cv.width=innerWidth;ch=cv.height=innerHeight;const s=Math.max(cw/2560,ch/1440);iw=2560*s;ih=1440*s;ox=(cw-iw)*.72;oy=(ch-ih)*.5}rs();addEventListener('resize',rs);
const PA=[[.62,0,.64,.32,'#3b82f6'],[.66,.3,.64,0,'#ef4444'],[.72,.28,.99,.15,'#ef4444'],[.99,.5,.82,.6,'#3b82f6']];
const PT=Array.from({length:70},(_,k)=>({p:k%4,t:Math.random(),v:.002+Math.random()*.003,w:Math.random()*6}));
function loop(){if(!cvOn){lp=0;return}lp=1;cx.clearRect(0,0,cw,ch);for(const q of PT){q.t+=q.v;q.w+=.05;if(q.t>1)q.t=0;const a=PA[q.p],x=ox+(a[0]+(a[2]-a[0])*q.t)*iw+Math.sin(q.w)*5,y=oy+(a[1]+(a[3]-a[1])*q.t)*ih;cx.beginPath();cx.fillStyle=a[4];cx.shadowColor=a[4];cx.shadowBlur=12;cx.arc(x,y,2.5+Math.sin(q.w)*.8,0,7);cx.fill()}requestAnimationFrame(loop)}
loop();
</script></body></html>
